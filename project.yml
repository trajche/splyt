name: Splyt
options:
  bundleIdPrefix: com.amplify2
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SplytCore:
    path: SplytCore
  # Official WireGuardKit, vendored at a pinned commit by scripts/build-wireguard.sh,
  # which also builds the Go half (libwg-go.a) into build/wireguard.
  WireGuardKit:
    path: Vendor/wireguard-apple
settings:
  base:
    DEVELOPMENT_TEAM: A4XZSTY453
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    # Developer ID builds use profiles made in the developer portal. System
    # extensions only activate from such a build on a Mac with SIP enabled.
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: --timestamp
targets:
  Splyt:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SplytCore
      - target: SplytProxy
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ../Library/SystemExtensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amplify2.splyt
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: App/App.Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: Splyt Developer ID
  SplytProxy:
    type: system-extension
    platform: macOS
    sources:
      - path: Extension
    dependencies:
      - package: SplytCore
      - package: WireGuardKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: com.amplify2.splyt.proxy
        PRODUCT_MODULE_NAME: SplytProxy
        PRODUCT_BUNDLE_IDENTIFIER: com.amplify2.splyt.proxy
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extension/Info.plist
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/wireguard
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Extension/Extension.Release.entitlements
          PROVISIONING_PROFILE_SPECIFIER: Splyt Proxy Developer ID
