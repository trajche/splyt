name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        run: swift test --package-path SplytCore

      - name: Firefox extension tests
        run: node --test Firefox/test/rules.test.cjs

      - uses: ./.github/actions/wireguard

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project Splyt.xcodeproj -scheme Splyt -configuration Debug \
            -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO build
